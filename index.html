<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estilos de vida entre generaciones</title>
<style>
  :root {
    --bosque: #1f4d3a;
    --musgo: #4f7f3f;
    --rio: #1f7a8c;
    --tierra: #8a5a2b;
    --fondo: #eef3ec;
    --papel: #ffffff;
    --texto: #1c2a22;
    --suave: #5b6b61;
    --linea: #cfdccd;
    --error: #a63a2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.5;
  }
  header {
    background: var(--bosque);
    color: #fff;
    padding: 2.5rem 1.25rem 2rem;
  }
  .contenedor { max-width: 1100px; margin: 0 auto; }
  header h1 {
    margin: 0 0 .75rem;
    font-size: clamp(1.8rem, 5vw, 3rem);
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -.01em;
  }
  header p { margin: 0; max-width: 62ch; color: #dcebd9; }
  main { padding: 1.5rem 1.25rem 3rem; }
  .columnas {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
    align-items: start;
  }
  @media (max-width: 860px) {
    .columnas { grid-template-columns: 1fr; }
  }
  .persona {
    background: var(--papel);
    border: 1px solid var(--linea);
    border-top: 6px solid var(--color);
    border-radius: 10px;
    padding: 1.1rem 1.1rem 1.25rem;
  }
  .persona h2 { margin: 0 0 .9rem; font-size: 1.3rem; color: var(--color); }
  .persona.abuelo { --color: var(--tierra); }
  .persona.padre  { --color: var(--musgo); }
  .persona.amigo  { --color: var(--rio); }
  label { display: block; font-size: .92rem; font-weight: 600; margin: .9rem 0 .3rem; }
  input, textarea {
    width: 100%;
    font: inherit;
    padding: .55rem .65rem;
    border: 1px solid #aebdaa;
    border-radius: 6px;
    background: #fbfdfb;
    color: var(--texto);
  }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible {
    outline: 3px solid var(--color, var(--rio));
    outline-offset: 1px;
  }
  .vacio { border-color: var(--error); background: #fff4f2; }
  .acciones { margin-top: 1.75rem; }
  button {
    font: inherit;
    font-weight: 700;
    padding: .85rem 2rem;
    border: 0;
    border-radius: 8px;
    background: var(--bosque);
    color: #fff;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #163a2b; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #aviso { margin: .9rem 0 0; font-weight: 600; min-height: 1.5em; }
  #aviso.error { color: var(--error); }
  #aviso.info { color: var(--suave); }
  #resultado {
    margin-top: 1rem;
    padding: 1.25rem;
    background: var(--papel);
    border: 1px solid var(--linea);
    border-left: 6px solid var(--musgo);
    border-radius: 10px;
    white-space: pre-line;
  }
  #resultado[hidden] { display: none; }
  footer { text-align: center; color: var(--suave); font-size: .85rem; padding: 0 1rem 2rem; }
</style>
</head>
<body>

<header>
  <div class="contenedor">
    <h1>Estilos de vida entre generaciones</h1>
    <p>Se entrevistó a tres generaciones (un abuelo o abuela, un padre o madre y un amigo o amiga) sobre sus hábitos de consumo para compararlos. Captura sus respuestas y una inteligencia artificial las comparará.</p>
  </div>
</header>

<main class="contenedor">
  <form id="formulario" novalidate>
    <div class="columnas" id="columnas"></div>

    <div class="acciones">
      <button type="submit" id="btnComparar">Comparar respuestas</button>
      <p id="aviso" role="status" aria-live="polite"></p>
    </div>
  </form>

  <section id="resultado" hidden aria-live="polite"></section>
</main>

<footer>Desarrollo Sustentable · TecNM · Práctica 3.4-P8</footer>

<script>
  // Pega aquí la URL de tu webhook de Make (Webhooks → Custom webhook)
  const WEBHOOK_URL = "https://hook.us2.make.com/q13dkmvzxnejrd7dcf52av77c6cmfc96";

  const PREGUNTAS = [
    "¿Cómo se conseguía la comida en casa: mercado, tienda, súper o cultivo propio?",
    "¿Qué se hacía con la ropa o los zapatos viejos o rotos?",
    "¿Qué aparatos electrónicos tenías y cada cuánto los cambiabas?",
    "¿Cómo te transportabas a la escuela o al trabajo?",
    "¿Qué se hacía con la basura? ¿Se separaba o se reutilizaba algo?",
    "¿Usabas bolsas, botellas o envases desechables?",
    "¿Cómo se usaba y se cuidaba el agua en casa?",
    "¿Qué consideras necesario para vivir bien?"
  ];

  // Los nombres de campo (abuelo, padre, amigo) no deben cambiar
  const PERSONAS = [
    { id: "abuelo", titulo: "Abuelo/a" },
    { id: "padre",  titulo: "Padre/Madre" },
    { id: "amigo",  titulo: "Amigo/a" }
  ];

  const contenedor = document.getElementById("columnas");
  const form = document.getElementById("formulario");
  const btn = document.getElementById("btnComparar");
  const aviso = document.getElementById("aviso");
  const resultado = document.getElementById("resultado");

  // Construir las tres secciones
  PERSONAS.forEach(p => {
    const sec = document.createElement("section");
    sec.className = "persona " + p.id;
    let html = `<h2>${p.titulo}</h2>
      <label for="${p.id}-edad">Edad</label>
      <input type="number" id="${p.id}-edad" min="1" max="120" inputmode="numeric">`;
    PREGUNTAS.forEach((q, i) => {
      html += `<label for="${p.id}-p${i + 1}">${i + 1}. ${q}</label>
        <textarea id="${p.id}-p${i + 1}"></textarea>`;
    });
    sec.innerHTML = html;
    contenedor.appendChild(sec);
  });

  function mostrarAviso(texto, tipo) {
    aviso.textContent = texto;
    aviso.className = tipo || "";
  }

  // Verifica que todos los campos tengan contenido y marca los vacíos
  function validar() {
    let completo = true;
    form.querySelectorAll("input, textarea").forEach(campo => {
      const vacio = campo.value.trim() === "";
      campo.classList.toggle("vacio", vacio);
      if (vacio) completo = false;
    });
    return completo;
  }

  // Arma el texto de una persona con el formato pedido
  function armarTexto(id) {
    let texto = "Edad: " + document.getElementById(id + "-edad").value.trim();
    PREGUNTAS.forEach((q, i) => {
      const r = document.getElementById(id + "-p" + (i + 1)).value.trim();
      texto += "\n" + (i + 1) + ". " + q + ": " + r;
    });
    return texto;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    resultado.hidden = true;

    if (!validar()) {
      mostrarAviso("Faltan campos por llenar. Completa los campos marcados en rojo.", "error");
      return;
    }

    const cuerpo = new URLSearchParams();
    PERSONAS.forEach(p => cuerpo.append(p.id, armarTexto(p.id)));

    btn.disabled = true;
    mostrarAviso("Analizando respuestas, esto puede tardar unos segundos...", "info");

    try {
      const resp = await fetch(WEBHOOK_URL, { method: "POST", body: cuerpo });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const texto = await resp.text();
      resultado.textContent = texto;
      resultado.hidden = false;
      mostrarAviso("", "");
    } catch (err) {
      mostrarAviso("No se pudo obtener el análisis, intenta de nuevo.", "error");
    } finally {
      btn.disabled = false;
    }
  });

  // Quitar la marca roja al escribir
  form.addEventListener("input", (e) => e.target.classList.remove("vacio"));
</script>
</body>
</html>
